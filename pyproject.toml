[project]
name = "akira-ops-api"
version = "0.1.0"
description = "AKIRA Ops Suite — FastAPI backend (Stage 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    # zoneinfo has no tz database of its own on Windows or on slim Linux
    # images. Asia/Kolkata must resolve everywhere the business date is
    # computed, so ship the data rather than depending on the host.
    "tzdata>=2024.2",
    # Staff PINs for the shared tablet. Argon2 rather than bcrypt because a
    # 4-digit PIN has almost no entropy, so the hash must be expensive.
    "argon2-cffi>=23.1.0",
    "email-validator>=2.3.0",
    # Photo integrity: perceptual hashing and mean luminance. Both run in a
    # background task, never in a request path.
    "pillow>=11.0.0",
    "imagehash>=4.3.1",
    # In-process scheduler for the daily jobs. Single instance for Stage 1;
    # a second replica would need a shared lock before this is safe.
    "apscheduler>=3.10.4",
    # The advisory vision review (D6).
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
# Bengali item names are the point of this file, not a typo. RUF001-003
# flag non-Latin characters as confusable with Latin ones.
"scripts/generate_inventory_seed.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["jose.*", "asyncpg.*", "apscheduler.*", "imagehash.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
