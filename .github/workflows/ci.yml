name: CI

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time. A second push while a deploy is waiting for approval
# cancels the older wait, so the approval always applies to the newest code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # The migration tests build a database from zero on every run. That is the
    # only way to know the migrations actually apply, rather than that some
    # long-lived database happens to have the right shape.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Never point this at Supabase: the fixtures drop the database they create.
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.25"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest

      - name: Seed generators reproduce their output
        run: |
          uv run python scripts/generate_sop_seed.py
          uv run python scripts/generate_inventory_seed.py
          git diff --exit-code supabase/seed/ || {
            echo "::error::A seed file is out of step with its generator."
            exit 1
          }

      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale. Run scripts/export_openapi.py and commit."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Production. Runs only for a push to main that passed every check above,
  # only when the owner has switched the pipeline on (repository variable
  # DEPLOY_ENABLED=true), and only after a reviewer approves it in the
  # `production` environment. docs/RUNBOOK_DEPLOY.md section 2 is the setup.
  # ---------------------------------------------------------------------------
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    concurrency:
      group: deploy-api
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.25"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-dev

      # Schema first, code second: a new column the API expects must exist
      # before the machine that reads it starts. Each file runs in its own
      # transaction and is recorded only if it succeeded (scripts/migrate.py).
      - name: Apply pending migrations
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          uv run python scripts/migrate.py --plan
          uv run python scripts/migrate.py --apply

      # Render builds the Dockerfile itself. autoDeploy is off in render.yaml,
      # so this API call is the only way a deploy starts: after CI, after the
      # approval, after the migrations. Then wait for Render to say it is live.
      - name: Deploy the API to Render (singapore, free)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY" -a -n "$RENDER_SERVICE_ID" || { echo "::error::RENDER_API_KEY and RENDER_SERVICE_ID must be production environment secrets."; exit 1; }
          auth="Authorization: Bearer $RENDER_API_KEY"
          deploy=$(curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" -H "$auth" -H "Content-Type: application/json" -d '{"clearCache":"do_not_clear"}')
          id=$(echo "$deploy" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          echo "deploy $id started"
          for i in $(seq 1 60); do
            status=$(curl -fsS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id" -H "$auth" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "  $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy ended as $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render deploy did not go live within 15 minutes"; exit 1

      - name: Smoke the deployment
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 20); do
            health=$(curl -fsS "$API_URL/healthz" || true)
            ready=$(curl -fsS "$API_URL/readyz" || true)
            if echo "$health" | grep -q '"env":"production"' && echo "$ready" | grep -q '"database":"ok"'; then
              echo "healthz: $health"; echo "readyz:  $ready"; exit 0
            fi
            sleep 6
          done
          echo "::error::The deployed API did not answer healthy within two minutes."
          echo "healthz: $health"; echo "readyz: $ready"
          exit 1
